<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Rudy Atallah — Cybersécurité &amp; Ethical Hacking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#111a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee59d"/>
      <stop offset="1" stop-color="#22b8cf"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2ee59d" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2ee59d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'DejaVu Sans Mono', monospace; }
      .sans { font-family: 'Inter', 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .scan { animation: scan 6s ease-in-out infinite; }
      @keyframes scan { 0%, 100% { transform: translateY(0); opacity: 0; } 10% { opacity: .55; } 50% { transform: translateY(176px); opacity: .55; } 60% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- hex dump décoratif -->
    <g class="mono" font-size="13" fill="#2ee59d" opacity="0.10">
      <text x="760" y="40">4e 6d 61 70 20 2d 73 56 20 2d 2d 73 63 72 69 70</text>
      <text x="760" y="64">74 20 76 75 6c 6e 65 72 73 0a 6e 75 63 6c 65 69</text>
      <text x="760" y="88">64 68 63 70 20 73 6e 6f 6f 70 69 6e 67 0a 61 72</text>
      <text x="760" y="232">70 20 69 6e 73 70 65 63 74 69 6f 6e 20 76 6c 61</text>
      <text x="760" y="256">6e 20 31 30 2c 32 30 2c 33 30 2c 34 30 0a 65 6e</text>
      <text x="760" y="280">64 0a 77 68 6f 61 6d 69 0a 72 75 64 79 0a 0a 0a</text>
    </g>

    <!-- bouclier -->
    <g transform="translate(1000 62)">
      <path d="M0 0 L78 28 V92 C78 136 44 166 0 182 C-44 166 -78 136 -78 92 V28 Z" fill="#0f1720" stroke="url(#accent)" stroke-width="3"/>
      <path d="M0 22 L58 43 V92 C58 124 34 147 0 160 C-34 147 -58 124 -58 92 V43 Z" fill="none" stroke="#2ee59d" stroke-opacity="0.25" stroke-width="1.5"/>
      <!-- cadenas -->
      <rect x="-24" y="84" width="48" height="38" rx="6" fill="url(#accent)"/>
      <path d="M-14 84 V72 A14 14 0 0 1 14 72 V84" fill="none" stroke="url(#accent)" stroke-width="5"/>
      <circle cx="0" cy="100" r="5" fill="#0b0f17"/>
      <rect x="-2" y="102" width="4" height="10" rx="2" fill="#0b0f17"/>
      <!-- ligne de scan -->
      <rect class="scan" x="-80" y="0" width="160" height="2" fill="#2ee59d" opacity="0"/>
    </g>

    <!-- texte -->
    <text x="72" y="92" class="mono" font-size="20" fill="#2ee59d">rudy@efrei:~$ <tspan fill="#c9d1d9">whoami</tspan><tspan class="cursor" fill="#2ee59d"> ▌</tspan></text>
    <text x="70" y="166" class="sans" font-size="66" font-weight="800" fill="#f0f6fc" letter-spacing="-1">Rudy Atallah</text>
    <text x="72" y="208" class="sans" font-size="24" font-weight="500" fill="#8b949e">Cybersécurité &amp; Ethical Hacking · EFREI Bordeaux</text>

    <!-- pastille -->
    <g transform="translate(72 234)">
      <rect width="354" height="36" rx="18" fill="#2ee59d" fill-opacity="0.12" stroke="#2ee59d" stroke-opacity="0.55"/>
      <circle cx="22" cy="18" r="5" fill="#2ee59d"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="38" y="24" class="sans" font-size="16" font-weight="600" fill="#2ee59d">En recherche d'alternance · Bordeaux</text>
    </g>
  </g>
</svg>
